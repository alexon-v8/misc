<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Mirror Clock & Hand Angles</title>
  <link rel="stylesheet" href="mirror-clock.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <nav class="topbar">
    <a href="index.html" class="back-btn">&larr; Exhibition Hub</a>
    <span class="title">01 // 3D Mirror Clock &amp; |30H &minus; 5.5M| Protractor</span>
  </nav>

  <main class="layout">
    <section class="glass-panel">
      <div class="stage-header">
        <span>3D WebGL Symmetry Stage (Drag to Rotate)</span>
        <span class="hint">Cyan: Real &bull; Purple: Reflection</span>
      </div>
      <div id="threeBox" class="canvas-3d"></div>
      <div class="controls">
        <div class="slider-group">
          <label><span>Hour (H)</span><strong id="hVal">3</strong></label>
          <input type="range" id="hSlider" min="1" max="12" value="3" />
        </div>
        <div class="slider-group">
          <label><span>Minute (M)</span><strong id="mVal">40</strong></label>
          <input type="range" id="mSlider" min="0" max="59" value="40" />
        </div>
        <button id="modeBtn" class="neon-btn">Axis: Vertical Mirror (11:60 Subtraction)</button>
      </div>
    </section>

    <section class="glass-panel">
      <h2>Choreographed Digit Engines</h2>
      <div class="formula-box">
        <div class="f-label">Mirror Reflection Machine</div>
        <div id="mirrorStage" class="digit-track"></div>
      </div>
      <div class="formula-box">
        <div class="f-label">Exact Hand Angle: &theta; = |30H &minus; 5.5M|</div>
        <div id="angleStage" class="digit-track"></div>
      </div>
      <div class="radar-wrap">
        <canvas id="radarCanvas"></canvas>
      </div>
    </section>
  </main>
  <script src="mirror-clock.js"></script>
</body>
</html>
