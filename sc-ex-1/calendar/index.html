<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Calendar Modulo-7 Time Gear</title>
  <link rel="stylesheet" href="calendar-mod7.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <nav class="topbar">
    <a href="index.html" class="back-btn">&larr; Exhibition Hub</a>
    <span class="title">02 // 3D Heptagonal Time Crystal &amp; Mod-7 Vaporizer</span>
  </nav>

  <main class="layout">
    <section class="glass-panel">
      <div class="stage-header">
        <span>3D 7-Sided Weekday Prism (Each Face = Remainder 0–6)</span>
      </div>
      <div id="prismBox" class="canvas-3d"></div>
      <div class="controls">
        <input type="date" id="dateInput" value="2026-10-30" />
        <button id="vaporBtn" class="neon-btn">Fire Mod-7 Remainder Vaporizer &⚡;</button>
      </div>
      <div id="resultBanner" class="banner"></div>
    </section>

    <section class="glass-panel">
      <h2>Plasma Remainder Vaporizer Chamber</h2>
      <p class="desc">Every full multiple of 7 spins the 3D crystal 360&deg; back to the same face—so multiples of 7 vaporize into sparks, leaving tiny remainders!</p>
      <canvas id="vaporCanvas"></canvas>
      <div id="tokenSteps" class="steps-list"></div>
    </section>
  </main>
  <script src="calendar-mod7.js"></script>
</body>
</html>
